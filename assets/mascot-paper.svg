<svg xmlns="http://www.w3.org/2000/svg" width="880" height="118" viewBox="0 0 880 118" role="img" aria-label="Mirra, a half-lavender half-peach symmetry fox, merges two glowing orbs into one"><style>.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}.shadow{transform-box:fill-box;transform-origin:center;animation:sh 2.4s ease-in-out infinite}@keyframes sh{50%{transform:scaleX(.85);opacity:.25}}.tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 1.6s ease-in-out infinite alternate}@keyframes tail{to{transform:rotate(14deg)}}.oL{animation:oL 4s ease-in-out infinite}@keyframes oL{0%,15%{transform:translateX(0)}55%,70%{transform:translateX(34px)}71%,100%{transform:translateX(0)}}.oR{animation:oR 4s ease-in-out infinite}@keyframes oR{0%,15%{transform:translateX(0)}55%,70%{transform:translateX(-34px)}71%,100%{transform:translateX(0)}}.fused{transform-box:fill-box;transform-origin:center;opacity:0;animation:fz 4s ease-in-out infinite}@keyframes fz{0%,52%{opacity:0;transform:scale(.4)}58%{opacity:1;transform:scale(1.25)}68%{opacity:1;transform:scale(1)}72%,100%{opacity:0;transform:scale(.6)}}.spark{animation:sp 4s linear infinite;opacity:0}@keyframes sp{0%,55%{opacity:0}58%{opacity:1}75%,100%{opacity:0;transform:translateY(-12px)}}.hp{transform-box:fill-box;animation:hp 6s ease-in-out infinite}@keyframes hp{0%,100%{transform:scaleX(1)}40%{transform:scaleX(.55)}}</style><defs><radialGradient id="mL" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ece4ff"/><stop offset=".55" stop-color="#b6a4f2"/><stop offset="1" stop-color="#6e5cc0"/></radialGradient><radialGradient id="mR" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffe6d0"/><stop offset=".55" stop-color="#f4ad86"/><stop offset="1" stop-color="#c96d52"/></radialGradient><radialGradient id="orbL"