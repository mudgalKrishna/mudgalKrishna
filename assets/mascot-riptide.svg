<svg xmlns="http://www.w3.org/2000/svg" width="420" height="104" viewBox="0 0 420 104" role="img" aria-label="Lure, an ember anglerfish whose glowing lure is a mouse cursor, clicks while it swims"><style>.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}.shadow{transform-box:fill-box;transform-origin:center;animation:sh 2.4s ease-in-out infinite}@keyframes sh{50%{transform:scaleX(.85);opacity:.25}}.swim{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translate(-4px,-6px) rotate(-3deg)}}.rod{transform-box:fill-box;transform-origin:0% 100%;animation:rod 2s ease-in-out infinite alternate}@keyframes rod{to{transform:rotate(-16deg)}}.click{transform-box:fill-box;transform-origin:20% 10%;animation:ck 2s ease-in-out infinite}@keyframes ck{0%,70%{transform:scale(1)}78%{transform:scale(.8)}86%,100%{transform:scale(1)}}.rip{transform-box:fill-box;transform-origin:center;animation:rp 2s ease-out infinite;opacity:0}@keyframes rp{0%,76%{opacity:0;transform:scale(.2)}80%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}.fin{transform-box:fill-box;transform-origin:100% 50%;animation:fn .5s ease-in-out infinite alternate}@keyframes fn{to{transform:scaleX(.7)}}.bub{animation:bu 3s linear infinite}@keyframes bu{from{transform:translateY(0);opacity:.8}to{transform:translateY(-40px);opacity:0}}.hp{transform-box:fill-box;animation:hp 6s ease-in-out infinite}@keyframes hp{0%,100%{transform:scaleX(1)}40%{transform:scaleX(.55)}}</style><defs><radialGradient id="ember" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffd2a0"/><stop offset=".55" stop-color="#ff8f45"/><stop offset="1" stop-color="#b8431f"/></radialGradient><radialGradient id="belly" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff0d8"/><stop offset=".55" stop-color="#ffc890"/><stop offset="1" stop-color="#e08850"/></radialGradient></defs><ellipse class="shadow" cx="320" cy="102" rx="34" ry="3" fill="#000" opacity=".35"/><g transform="translate(118,58)"><rect width="132" height="36" rx="8" fill="#1a1530" stroke="#544878"/><text x="10" y="15" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#f4dccb">LURE</text><text x="122" y="15" font-family="Consolas,monospace" font-size="10" fill="#a99fd6" text-anchor="end">Lv.21</text><rect x="10" y="21" width="43" height="11" rx="5.5" fill="#ffa86b"/><text x="16" y="29.5" font-family="Consolas,monospace" font-size="8.5" font-weight="700" fill="#1a1530">EMBER</text><rect x="59" y="24.5" width="63" height="4" rx="2" fill="#2e2648"/><rect class="hp" x="59" y="24.5" width="63" height="4" rx="2" fill="#8fe3a0"/></g><g transform="translate(320,104) scale(1.0)"><g class="swim" transform="translate(0,-38)"><path class="fin" d="M-30 0 L-50 -16 L-46 0 L-50 16 Z" fill="#e0662e"/><ellipse cx="0" cy="0" rx="32" ry="26" fill="url(#ember)"/><ellipse cx="4" cy="10" rx="20" ry="11" fill="url(#belly)" opacity=".7"/><path d="M8 6 Q 22 4 30 0 Q 24 16 8 14 Z" fill="#3a1424"/><path d="M12 7 l2 3 l2 -3 M18 6 l2 3 l2 -3 M24 4 l2 3 l2 -3" stroke="#fff" stroke-width="1.2" fill="none"/><path d="M-6 -22 L0 -32 L6 -24 L12 -30 L14 -20" fill="#e0662e"/><g class="blink"><ellipse cx="12" cy="-8" rx="4.4" ry="5.5" fill="#1a1426"/><circle cx="13.7" cy="-10.2" r="1.8" fill="#fff"/></g><g class="rod"><path d="M8 -24 C 10 -50 34 -58 46 -44" stroke="#8a3a1c" stroke-width="2.2" fill="none" stroke-linecap="round"/><g transform="translate(44,-46)"><circle class="rip" cx="2" cy="2" r="10" fill="none" stroke="#ffe08a" stroke-width="2"/><path class="click" d="M0 0 L0 15 L4 11 L7 18 L10 16.6 L7 10 L12 10 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></g></g></g><g fill="none" stroke="#bfe6ff" stroke-opacity=".8"><circle class="bub" cx="-40" cy="-30" r="3"/><circle class="bub" cx="-34" cy="-20" r="2" style="animation-delay:-1.2s"/><circle class="bub" cx="-46" cy="-14" r="2.4" style="animation-delay:-2.1s"/></g></g></svg>