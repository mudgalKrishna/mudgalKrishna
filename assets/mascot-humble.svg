<svg xmlns="http://www.w3.org/2000/svg" width="420" height="104" viewBox="0 0 420 104" role="img" aria-label="Humbo, a turtle with a shield-shaped shell, flips a sign from BLOCK to PASS"><style>.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}.shadow{transform-box:fill-box;transform-origin:center;animation:sh 2.4s ease-in-out infinite}@keyframes sh{50%{transform:scaleX(.85);opacity:.25}}.head{animation:hd 2.4s ease-in-out infinite}@keyframes hd{50%{transform:translate(2px,-2px)}}.sign{transform-box:fill-box;transform-origin:50% 100%;animation:sg 6s ease-in-out infinite}@keyframes sg{0%,40%{transform:scaleX(1)}45%{transform:scaleX(0)}50%,90%{transform:scaleX(1)}95%{transform:scaleX(0)}100%{transform:scaleX(1)}}.blk{animation:bk 6s steps(1) infinite}@keyframes bk{0%{opacity:1}45%{opacity:0}95%{opacity:1}}.pas{animation:ps 6s steps(1) infinite;opacity:0}@keyframes ps{0%{opacity:0}45%{opacity:1}95%{opacity:0}}.glint{animation:gl 6s ease-in-out infinite;opacity:0}@keyframes gl{0%,50%{opacity:0;transform:translateX(-30px)}60%{opacity:.8}75%,100%{opacity:0;transform:translateX(30px)}}.hp{transform-box:fill-box;animation:hp 6s ease-in-out infinite}@keyframes hp{0%,100%{transform:scaleX(1)}40%{transform:scaleX(.55)}}</style><defs><radialGradient id="shell" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#cfe0ff"/><stop offset=".55" stop-color="#6f93e8"/><stop offset="1" stop-color="#33479a"/></radialGradient><radialGradient id="skin" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#e8fff0"/><stop offset=".55" stop-color="#9edcb8"/><stop offset="1" stop-color="#4f9a78"/></radialGradient><clipPath id="shc"><path d="M-36 -8 C -36 -52 36 -52 36 -8 Z"/></clipPath></defs><ellipse class="shadow" cx="330" cy="102" rx="34" ry="3" fill="#000" opacity=".35"/><g transform="trans