<svg xmlns="http://www.w3.org/2000/svg" width="420" height="112" viewBox="0 0 420 112" role="img" aria-label="Humbo, a turtle with a shield-shaped shell, flips a sign from BLOCK to PASS; hover to fire an aqua jet"><style>.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}.shadow{transform-box:fill-box;transform-origin:center;animation:sh 2.4s ease-in-out infinite}@keyframes sh{50%{transform:scaleX(.88);opacity:.3}}.hp{transform-box:fill-box;animation:hp 6s ease-in-out infinite}@keyframes hp{0%,100%{transform:scaleX(1)}40%{transform:scaleX(.55)}}.atk{opacity:0}.hit{cursor:pointer}.mv{opacity:0;transition:opacity .2s}svg:hover .mv{opacity:1}svg:hover .idle{opacity:0}svg:hover .hp{animation:none;transform:scaleX(1)}.head{animation:hd 2.4s ease-in-out infinite}@keyframes hd{50%{transform:translate(-2px,-2px)}}.sign{transform-box:fill-box;transform-origin:50% 100%;animation:sg 6s ease-in-out infinite}@keyframes sg{0%,40%{transform:scaleX(1)}45%{transform:scaleX(0)}50%,90%{transform:scaleX(1)}95%{transform:scaleX(0)}100%{transform:scaleX(1)}}.blk{animation:bk 6s steps(1) infinite}@keyframes bk{0%{opacity:1}45%{opacity:0}95%{opacity:1}}.pas{animation:ps 6s steps(1) infinite;opacity:0}@keyframes ps{0%{opacity:0}45%{opacity:1}95%{opacity:0}}.glint{animation:gl 6s ease-in-out infinite;opacity:0}@keyframes gl{0%,50%{opacity:0;transform:translateX(-30px)}60%{opacity:.8}75%,100%{opacity:0;transform:translateX(30px)}}svg:hover .head{animation:hdj 1.4s ease-in-out infinite}@keyframes hdj{0%{transform:translate(0,0)}14%,70%{transform:translate(-6px,-12px) rotate(-12deg)}86%,100%{transform:translate(0,0)}}svg:hover .sign{animation:none}svg:hover .blk{animation:none;opacity:0}svg:hover .pas{animation:none;opacity:1}svg:hover .jet{animation:jet 1.4s ease-out infinite}@keyframes jet{0%,12%{s