<svg xmlns="http://www.w3.org/2000/svg" width="420" height="112" viewBox="0 0 420 112" role="img" aria-label="Bimo, a little two-armed robot, lifts a plate and a mug; hover to unleash a volt shock"><style>.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}.shadow{transform-box:fill-box;transform-origin:center;animation:sh 2.4s ease-in-out infinite}@keyframes sh{50%{transform:scaleX(.88);opacity:.3}}.hp{transform-box:fill-box;animation:hp 6s ease-in-out infinite}@keyframes hp{0%,100%{transform:scaleX(1)}40%{transform:scaleX(.55)}}.atk{opacity:0}.hit{cursor:pointer}.mv{opacity:0;transition:opacity .2s}svg:hover .mv{opacity:1}svg:hover .idle{opacity:0}svg:hover .hp{animation:none;transform:scaleX(1)}.armL{transform-box:fill-box;transform-origin:100% 0%;animation:aL 2.2s ease-in-out infinite}@keyframes aL{50%{transform:rotate(28deg)}}.armR{transform-box:fill-box;transform-origin:0% 0%;animation:aR 2.2s ease-in-out infinite}@keyframes aR{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(0)}}.ant{animation:an 1s steps(1) infinite}@keyframes an{50%{fill:#5a4a8a}}.steam{animation:st 2s linear infinite}@keyframes st{from{opacity:.8;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}.legs{transform-box:fill-box;transform-origin:50% 0%;animation:lg 1.4s ease-in-out infinite alternate}@keyframes lg{to{transform:rotate(-8deg)}}svg:hover .armL{animation:none;transform:rotate(40deg)}svg:hover .armR{animation:none;transform:rotate(-40deg)}svg:hover .ant{animation:anf .12s steps(1) infinite}@keyframes anf{50%{fill:#fff6a8}}svg:hover .bob{animation:jit .1s steps(2) infinite}@keyframes jit{50%{transform:translate(1px,-1px)}}svg:hover .b1{animation:b1 .5s steps(1) infinite}@keyframes b1{0%{opacity:1}25%{opacity:0}50%{opacity:1}75%{opacity:0}}svg:hover .b2{animation:b2 .5s steps(1) infinite}@keyframes b2{0%{opacity:0}25%{opacity:1}50%{opacity:0}75%{opacity:1}}svg:hover .arc{animation:b1 .3s steps(1) infinite}svg:hover .zap{animation:zap .5s steps(1) infinite}@keyframes zap{0%{opacity:.5}20%{opacity:0}60%{opacity:.35}80%{opacity:0}}.bolt-hit{transform-box:fill-box;transform-origin:center}svg:hover .bolt-hit{animation:bh .5s ease-out infinite}@keyframes bh{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}</style><defs><filter id="soft" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="2.6"/></filter><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="metal" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d4cef0"/><stop offset="1" stop-color="#6f67a6"/></radialGradient><radialGradient id="dark" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#4a4070"/><stop offset=".55" stop-color="#1e1838"/><stop offset="1" stop-color="#0e0a1c"/></radialGradient><linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><radialGradient id="mug" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffd6bc"/><stop offset=".55" stop-color="#f2a37a"/><stop offset="1" stop-color="#b8603c"/></radialGradient><radialGradient id="plate" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#fff3e4"/><stop offset="1" stop-color="#d8c6b4"/></radialGradient><filter id="metalf" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.12" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="50"/></feDiffuseLighting><feSpecularLighting in="b" surfaceScale="4" specularConstant="1.1" specularExponent="22" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="50"/></feSpecularLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" result="lit"/><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feComposite in="lit" in2="s2" operator="arithmetic" k2="1" k3="1" result="o"/><feComposite in="o" in2="SourceAlpha" operator="in"/></filter><filter id="clay" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/><feDiffuseLighting in="b" surfaceScale="3" diffuseConstant="1.12" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="50"/></feDiffuseLighting><feSpecularLighting in="b" surfaceScale="3" specularConstant="0.6" specularExponent="22" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="50"/></feSpecularLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" result="lit"/><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feComposite in="lit" in2="s2" operator="arithmetic" k2="1" k3="1" result="o"/><feComposite in="o" in2="SourceAlpha" operator="in"/></filter></defs><rect class="hit" x="230" y="0" width="170" height="112" fill="none" pointer-events="all"/><ellipse class="shadow" cx="320" cy="109" rx="36" ry="4" fill="#0a0614" opacity=".55" filter="url(#soft)"/><g transform="translate(118,66)"><rect width="132" height="36" rx="8" fill="#1a1530" stroke="#544878"/><text x="10" y="15" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#f4dccb">BIMO</text><text class="idle" x="122" y="15" font-family="Consolas,monospace" font-size="10" fill="#a99fd6" text-anchor="end">Lv.12</text><text class="mv" x="122" y="15" font-family="Consolas,