<svg xmlns="http://www.w3.org/2000/svg" width="420" height="104" viewBox="0 0 420 104" role="img" aria-label="Bimo, a little two-armed robot, lifts a plate and a mug like it is setting a table"><style>.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}.shadow{transform-box:fill-box;transform-origin:center;animation:sh 2.4s ease-in-out infinite}@keyframes sh{50%{transform:scaleX(.85);opacity:.25}}.armL{transform-box:fill-box;transform-origin:100% 0%;animation:aL 2.2s ease-in-out infinite}@keyframes aL{50%{transform:rotate(28deg)}}.armR{transform-box:fill-box;transform-origin:0% 0%;animation:aR 2.2s ease-in-out infinite}@keyframes aR{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(0)}}.ant{animation:an 1s steps(1) infinite}@keyframes an{50%{fill:#5a4a8a}}.steam{animation:st 2s linear infinite}@keyframes st{from{opacity:.8;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}.legs{transform-box:fill-box;transform-origin:50% 0%;animation:lg 1.4s ease-in-out infinite alternate}@keyframes lg{to{transform:rotate(-8deg)}}.hp{transform-box:fill-box;animation:hp 6s ease-in-out infinite}@keyframes hp{0%,100%{transform:scaleX(1)}40%{transform:scaleX(.55)}}</style><defs><radialGradient id="metal" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#cfc8ee"/><stop offset="1" stop-color="#7c74ae"/></radialGradient><radialGradient id="dark" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#4a4070"/><stop offset=".55" stop-color="#241c40"/><stop offset="1" stop-color="#120e22"/></radialGradient></defs><ellipse class="shadow" cx="320" cy="102" rx="34" ry="3" fill="#000" opacity=".35"/><g transform="translate(118,58)"><rect width="132" height="36" rx="8" fill="#1a1530" stroke="#544878"/><text x="10" y="15" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#f4dccb">BIMO</text><text x="122" y="15" font-family="Consolas,monospace" font-size="10" fill="#a99fd6" text-anchor="end">Lv.12</text><rect x="10" y="21" width="43" height="11" rx="5.5" fill="#cfc8ee"/><text x="16" y="29.5" font-family="Consolas,monospace" font-size="8.5" font-weight="700" fill="#1a1530">STEEL</text><rect x="59" y="24.5" width="63" height="4" rx="2" fill="#2e2648"/><rect class="hp" x="59" y="24.5" width="63" height="4" rx="2" fill="#8fe3a0"/></g><g transform="translate(320,104) scale(1.0)"><g class="legs"><rect x="-14" y="-12" width="8" height="12" rx="3" fill="url(#metal)"/><rect x="6" y="-12" width="8" height="12" rx="3" fill="url(#metal)"/></g><g class="bob"><rect x="-24" y="-52" width="48" height="42" rx="12" fill="url(#metal)"/><rect x="-17" y="-46" width="34" height="22" rx="7" fill="url(#dark)"/><g class="blink"><rect x="-11" y="-40" width="6" height="9" rx="3" fill="#8fe8ff"/><rect x="5" y="-40" width="6" height="9" rx="3" fill="#8fe8ff"/></g><path d="M-5 -28 q5 3 10 0" stroke="#8fe8ff" stroke-width="1.6" fill="none" stroke-linecap="round"/><line x1="0" y1="-52" x2="0" y2="-62" stroke="#7c74ae" stroke-width="2"/><circle class="ant" cx="0" cy="-64" r="3.5" fill="#ff9e7a"/><rect x="-14" y="-20" width="28" height="4" rx="2" fill="#a59dd0"/><g class="armL"><path d="M-24 -34 L-40 -26 L-46 -40" stroke="#9a92c8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="-48" cy="-44" rx="14" ry="3.6" fill="#fff6ea" stroke="#c9b8ff"/><ellipse cx="-48" cy="-45" rx="7" ry="1.6" fill="#e9dccb"/></g><g class="armR"><path d="M24 -34 L40 -26 L46 -40" stroke="#9a92c8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="-58" width="14" height="14" rx="2" fill="#f2a37a"/><path d="M54 -55 q6 2 0 8" stroke="#f2a37a" stroke-width="2.4" fill="none"/><path class="steam" d="M44 -62 q2 -3 0 -6 M49 -62 q2 -3 0 -6" stroke="#fff" stroke-opacity=".7" fill="none"/></g></g></g></svg>